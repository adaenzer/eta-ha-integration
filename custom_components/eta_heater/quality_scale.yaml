rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration does not register actions.
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration does not register actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Credentials are only used for an external MQTT broker and can be changed with the reconfigure flow.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: todo
    comment: Could use MQTT discovery on the zigbee2mqtt device topic.
  discovery-update-info: todo
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: One config entry is one heater.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations:
    status: exempt
    comment: Value names come from the heater's monitor list; fixed entities are translated.
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: One config entry is one heater.

  # Platinum
  async-dependency:
    status: todo
    comment: The external MQTT broker uses paho-mqtt with its network thread.
  inject-websession:
    status: exempt
    comment: No HTTP communication.
  strict-typing: todo
